<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Padding&Margind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <p class="bg-emerald-500 text-3xl font-serif text-center">
      Padding and Margin
    </p>
    <br />

    <!--padding left and right(x-axis) -->
    <button class="px-2 border-green-600 border-2">Click</button><br /><br />
    <!--padding top and bottom (y-axis)-->
    <button class="py-3 border-3">Click</button>

    <!-- pl - only left 
         pr - only right
         pt - only top 
         pb - only bottom 
    -->
<br>
    <!--Margin -->

    <button class="m-5">click </button><br>
    <button class="mt-5">Click</button><br>
    <button class="mb-5">Click</button><br>
    <button class="ml-5">Click</button>
  </body>
</html>
